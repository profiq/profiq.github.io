    const f=1-i/24;
    g.globalAlpha=0.12+0.6*f;
    if(trail==='duha')g.fillStyle='hsl('+Math.round((i*14+t*90)%360)+',85%,55%)';
    else if(trail==='plamen')g.fillStyle='hsl('+Math.round(12+35*f)+',95%,55%)';
    else if(trail==='jiskry')g.fillStyle='#FFD60A';
    else g.fillStyle=carColor();
    const r=trail==='cara'?2.5:3.2*(0.4+f);
    g.beginPath();g.arc(qx,qy,r,0,6.284);g.fill();
  }
  g.globalAlpha=1;
  if(fxk==='prstenec'){
    const rr=(t*40)%36;
    g.strokeStyle='#22C55E';g.globalAlpha=1-rr/36;g.lineWidth=2;
    g.beginPath();g.arc(w*0.5,h/2,rr+6,0,6.284);g.stroke();g.globalAlpha=1;
  }
  g.save();g.translate(px,py);
  g.fillStyle='#1F2937';g.fillRect(-12,-9,7,18);g.fillRect(5,-9,7,18);
  g.fillStyle=carColor();
  g.beginPath();
  if(g.roundRect)g.roundRect(-14,-7,28,14,4);else g.rect(-14,-7,28,14);
  g.fill();
  g.fillStyle='rgba(255,255,255,.85)';g.fillRect(-1,-4,6,8);
  g.restore();
  if(fxk==='hvezdy'){
    g.fillStyle='#FFD60A';
    for(let i=0;i<5;i++){
      const a=t*2+i*1.256;
      g.beginPath();g.arc(px+Math.cos(a)*26,py+Math.sin(a)*16,2,0,6.284);g.fill();
    }
  }
  if(fxk==='konfety'){
    for(let i=0;i<8;i++){
      g.fillStyle=SEG_COLORS[i];
      const a=t*1.5+i;
      g.fillRect(px+Math.cos(a)*30-1.5,py+Math.sin(a*1.3)*20-1.5,3,3);
    }
  }
}
function openGarage(){
  const tabs=[['car','Barva'],['trail','Trail'],['fx','Efekt']];
  const build=()=>{
    let html='<h2>Garáž</h2><canvas id="carprev"></canvas><div class="tabs">';
    for(const [k,n] of tabs)html+='<button class="btn '+(garageTab===k?'':'ghost')+'" data-tab="'+k+'">'+n+'</button>';
    html+='</div><div class="items">';
    const list=garageTab==='car'?COSMETICS.cars:(garageTab==='trail'?COSMETICS.trails:COSMETICS.fx);
    for(const it of list){
      const un=isUnlocked(it.id);
      const sel=SAVE[garageTab==='car'?'car':(garageTab==='trail'?'trail':'fx')]===it.id;
      html+='<button class="item'+(sel?' sel':'')+(un?'':' lock')+'" data-id="'+it.id+'"'+(un?'':' disabled')+'>'+
        (it.color?'<span class="sw" style="background:'+it.color+'"></span>':
          '<span class="sw" style="background:'+(it.key==='duha'?'linear-gradient(90deg,#E63946,#FFD60A,#06D6A0,#3A86FF)':
            it.key==='plamen'?'linear-gradient(90deg,#F4A300,#E63946)':
            it.key==='jiskry'?'#FFD60A':it.key==='prstenec'?'#06D6A0':it.key==='hvezdy'?'#FFD60A':'#2F6FED')+'"></span>')+
        '<span>'+it.name+'</span>'+(un?'':'<span class="muted">zamčeno</span>')+'</button>';
    }
    html+='</div><p class="hint">Další kousky odemkneš postupem hráčské úrovně (XP za medaile).</p>'+
      '<div class="rowbtns" style="margin-top:12px"><button class="btn" id="gclose" style="flex:1 1 0">Hotovo</button></div>';
    showOverlay(html,box=>{
      box.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{garageTab=b.dataset.tab;build()});
      box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
        const id=b.dataset.id;
        if(!isUnlocked(id))return;
        if(id.startsWith('car:'))SAVE.car=id;
        else if(id.startsWith('trail:'))SAVE.trail=id;
        else SAVE.fx=id;
        persist();SFX.click();build();
      });
      box.querySelector('#gclose').onclick=()=>{hideOverlay();if(!G.level)go('menu')};
    });
  };
  build();
}

/* ============================ 15. START ÚROVNĚ =========================== */
function loadLevel(L){
  G.level=L;
  G.segs=L.template.map(t=>({expr:t.expr,x0:t.x0,x1:t.x1,params:Object.assign({},t.params),
    fam:t.fam||L.family||'lin'}));
  G.race=null;G.trail=[];G.particles=[];
  q('#countdown').classList.remove('show');
  q('#hud').innerHTML='';
  showScreen('screen-game');
  resizeCanvas();
  buildSidebar();
  recompute();
  fitView();
  setHUD();
  if(L.mode==='tutorial')showIntro(L);
}
function showIntro(L){
  const F=FAMILIES[L.family];
  let html='<h2>'+L.title+'</h2>';
  html+='<div class="panel info" style="margin-bottom:12px"><p style="font-family:var(--mono);font-size:16px;color:#2F6FED;margin:0 0 8px">'+F.form+'</p><p style="margin:0">'+F.help+'</p></div>';
  html+='<p>'+L.help+'</p>';
  html+='<p class="muted" style="font-size:13px">Projeď všechny branky od <b>START</b> po <b>CÍL</b>. Úseky musí na sebe navazovat bez mezer i překryvů a v místě spojení mít stejné y. Kratší křivka = rychlejší čas.</p>';
  html+='<div class="rowbtns"><button class="btn big" id="intro-go">Jdu na to</button></div>';
  showOverlay(html,box=>{
    box.querySelector('#intro-go').onclick=()=>{initAudio();hideOverlay()};
  });
}
function toggleMute(){
  SAVE.mute=!SAVE.mute;persist();refreshHeader();
  if(!SAVE.mute){initAudio();SFX.click()}
}

/* ============================ 16. SMYČKA / VSTUP ========================= */
let lastT=performance.now();
function frame(now){
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;G.anim=now;
  if(q('#screen-game').classList.contains('active')){
    if(cv.clientWidth!==CW||cv.clientHeight!==CH)resizeCanvas();
    updateRace(dt);
    updateParticles(dt);
    render();
  }
  else if(q('#screen-menu').classList.contains('active'))drawHero();
  if(overlayOpen()&&q('#carprev'))drawCarPreview();
  requestAnimationFrame(frame);
}
document.addEventListener('keydown',e=>{
  const tgt=e.target,typing=tgt&&(tgt.tagName==='INPUT'||tgt.tagName==='TEXTAREA');
  if(e.key==='Escape'){
    e.preventDefault();
    if(overlayOpen())hideOverlay();
    else go('menu');
    return;
  }
  if(typing){
    if(e.key==='Enter'&&G.level){e.preventDefault();startRace()}
    return;
  }
  if(e.key==='Enter'&&G.level&&!overlayOpen()){e.preventDefault();startRace();return}
  const k=e.key.toLowerCase();
  if(k==='r'&&G.level){e.preventDefault();resetRace()}
  else if(k==='g'){
    e.preventDefault();SAVE.grid=!SAVE.grid;persist();
    const gb=q('#btn-grid');if(gb)gb.classList.toggle('on',SAVE.grid);
  }
});
document.addEventListener('pointerdown',()=>initAudio(),{once:true});
window.addEventListener('resize',()=>{if(q('#screen-game').classList.contains('active'))resizeCanvas()});
q('#btn-home').onclick=()=>go('menu');
q('#btn-mute').onclick=()=>toggleMute();
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{initAudio();SFX.click();go(b.dataset.go)});

refreshHeader();
renderMenuStats();
showScreen('screen-menu');
requestAnimationFrame(frame);

/* ============================ 17. AUTOTESTY ============================== */
/* Spustí se jen s ?test=1 v URL; slouží k ověření logiky (parser, verifikátor,
   referenční řešení, generátor, postupy). Ve hře samotné nemá žádný efekt. */
function selfTest(){
  const fails=[],ok=[];
  const t=(name,cond,extra)=>{cond?ok.push(name):fails.push(name+(extra?' — '+extra:''))};
  const ev=(src,x,pr)=>evalAst(parse(src),x,pr||{});
  /* parser */
  t('sčítání/priorita',ev('1+2*3',0)===7);
  t('mocnina vpravo',ev('2^3^2',0)===512);
  t('unární minus',ev('-x^2',3)===-9);
  t('závorky',ev('(1+2)*3',0)===9);
  t('parametry',ev('a*x+b',2,{a:3,b:1})===7);
  t('funkce abs',ev('abs(0-5)',0)===5);
  t('sqrt záporné → NaN',Number.isNaN(ev('sqrt(x)',-1)));
  t('log nekladné → NaN',Number.isNaN(ev('log(x)',0)));
  t('dělení nulou → NaN',Number.isNaN(ev('1/x',0)));
  t('velká mocnina konečná',Number.isFinite(ev('2^10',0)));
  for(const bad of ['','   ','1+','*2','sin','sin x','(1+2','1+2)','2$3','foo(2)','x**2','a+@']){
    let threw=false;try{parse(bad)}catch(e){threw=e instanceof ParseError}
    t('neplatný vstup „'+bad+'“ hlásí chybu',threw);
  }
  t('mezery a desetiny',Math.abs(ev(' 0.5 * x + .25 ',1)-0.75)<1e-9);
  t('velká písmena jako parametr',ev('A*x',2,{a:2})===4);
  /* referenční řešení tutoriálu */
  TUTORIALS.forEach(L=>{
    const v=verify(L.refPieces,L);
    t('tutoriál '+L.n+': referenční řešení projede',v.ok,v.msg);
    t('tutoriál '+L.n+': autorský čas > 0',L.authorTime>0);
    const pt=L.template&&verify(L.segs||L.template,L);
    t('tutoriál '+L.n+': výchozí šablona nedojede do cíle',!(pt&&pt.ok));
    t('tutoriál '+L.n+': branky mají konečné y',L.checkpoints.every(c=>Number.isFinite(c.y)));
    t('tutoriál '+L.n+': medaile za autorský čas',medalFor(L.authorTime,L.authorTime)==='author');
  });
  /* validace struktury */
  const L1=TUTORIALS[0];
  t('mezera odhalena',verify([mkSeg('0.5*x',0,3),mkSeg('-0.5*x+4',4,8),mkSeg('x-8',8,12)],L1).msg.indexOf('Mezera')===0);
  t('překryv odhalen',verify([mkSeg('0.5*x',0,5),mkSeg('-0.5*x+4',4,8),mkSeg('x-8',8,12)],L1).msg.indexOf('Úseky se překrývají')===0);
  t('nespojitost odhalena',verify([mkSeg('0.5*x',0,4),mkSeg('-0.5*x+9',4,8),mkSeg('x-8',8,12)],L1).msg.indexOf('Křivka není spojitá')===0);
  t('nepokrytý cíl odhalen',verify([mkSeg('0.5*x',0,4)],L1).msg.indexOf('Křivka nedosáhla')===0);
  t('nepokrytý start odhalen',verify([mkSeg('0.5*x',1,12)],L1).msg.indexOf('Křivka nezačíná')===0);
  t('minutá branka odhalena',verify([mkSeg('0*x+0.5*x',0,12)],L1).msg.indexOf('Křivka míjí')===0);
  t('prázdný seznam',verify([],L1).msg.length>0);
  t('chybný předpis',verify([mkSeg('a*x+',0,12,{a:1})],L1).msg.indexOf('Úsek 1')===0);
  t('chybějící parametr',verify([mkSeg('a*x',0,12,{})],L1).msg.indexOf('Úsek 1')===0);
  t('mimo obor odhaleno',verify([mkSeg('log(x-100)',0,12)],L1).msg.length>0);
  t('obří hodnoty odhaleny',verify([mkSeg('exp(5*x)',0,12)],L1).msg.length>0);
  /* generované úrovně */
  let genFails=0,gen=0;
  for(let fi=0;fi<FAM_ORDER.length;fi++){
    for(const n of [1,7,15,16,22,25,26,30]){
      const L=getCampLevel(fi,n);gen++;
      const v=verify(L.refPieces,L);
      if(!v.ok||!(L.authorTime>0)||L.family!==FAM_ORDER[fi])genFails++;
      if(L.refPieces.some(p=>{const fam=L.family;return false}))genFails++;
    }
  }
  t('kampaňové úrovně jsou řešitelné ('+gen+' testů)',genFails===0,genFails+' selhalo');
  let eFails=0;
  for(let n=1;n<=30;n++){
    const L=getEndlessLevel(n);
    const v=verify(L.refPieces,L);
    if(!v.ok||!(L.authorTime>0))eFails++;
  }
  t('nekonečné úrovně jsou řešitelné',eFails===0,eFails+' selhalo');
  /* determinismus */
  _lcache.clear();
  const a1=getCampLevel(3,12),s1=JSON.stringify(a1.refPieces)+a1.authorTime;
  _lcache.clear();
  const a2=getCampLevel(3,12),s2=JSON.stringify(a2.refPieces)+a2.authorTime;
  t('generátor je deterministický',s1===s2);
  /* medaile */
  t('autorská medaile v toleranci 2 %',medalFor(102,100)==='author');
  t('zlatá',medalFor(120,100)==='gold');
  t('stříbrná',medalFor(150,100)==='silver');
  t('bronzová',medalFor(190,100)==='bronze');
  t('bez medaile',medalFor(250,100)===null);
  t('★ podle medaile',STARS_FOR.author===3&&STARS_FOR.gold===3&&STARS_FOR.silver===2&&STARS_FOR.bronze===1);
  /* odemykání */
  t('tutoriál 1 odemčen',levelUnlocked(TUTORIALS[0]));
  t('kampaň: střední zamčené bez 20★',(()=>{const st=SAVE.stars;SAVE.stars={};const r=!levelUnlocked(getCampLevel(0,16));SAVE.stars=st;return r})());
  t('kampaň: těžké zamčené bez 45★',(()=>{const st=SAVE.stars;SAVE.stars={};const r=!levelUnlocked(getCampLevel(0,26));SAVE.stars=st;return r})());
  t('rodina omezena v kampani',getCampLevel(2,3).allowed.length===1&&getCampLevel(2,3).allowed[0]==='sin');
  t('nekonečný režim má všechny rodiny',getEndlessLevel(3).allowed.length===7);
  t('odmocnina dostupná od tutoriálu 1',TUTORIALS[0].allowed.includes('sqrt'));
  /* délka oblouku */
  const arcLin=verify([mkSeg('0*x+0',0,12)],{startX:0,finishX:12,checkpoints:[]},{skipGates:true}).arc;
  t('délka vodorovné úsečky = 12',Math.abs(arcLin-12)<0.01,String(arcLin));
  const arc45=verify([mkSeg('x',0,10)],{startX:0,finishX:10,checkpoints:[]},{skipGates:true}).arc;
  t('délka úhlopříčky ≈ 14.14',Math.abs(arc45-Math.SQRT2*10)<0.02,String(arc45));
  const out={ok:ok.length,fail:fails.length,fails};
  if(fails.length){console.error('AUTOTESTY: '+fails.length+' selhalo z '+(ok.length+fails.length));fails.forEach(f=>console.error(' × '+f))}
  else console.log('AUTOTESTY: všech '+ok.length+' testů prošlo.');
  return out;
}
window.__selftest=selfTest;
if(location.search.indexOf('test=1')>=0){
  try{window.__testResult=selfTest()}
  catch(e){console.error('AUTOTESTY havarovaly:',e);window.__testResult={fail:-1,error:String(e)}}
}

</script>
